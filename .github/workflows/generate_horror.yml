name: Generate ARG Broadcast

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Optional: Automatically run every day at midnight
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick

    - name: Install Python Libraries
      run: |
        pip install -r requirements.txt

    - name: Run Video Generator
# This runs the main script we created earlier
      run: python main.py

    - name: Upload Generated Video
      uses: actions/upload-artifact@v4
      with:
        name: arg-broadcast-video
        path: broadcast_*.mp4
        retention-days: 5
