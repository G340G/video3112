name: Generate Analog Horror Video

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/generate.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate video
        env:
          SEED: ${{ github.run_number }}
        run: |
          mkdir -p out
          python -m src.generator --out out/analog_horror_${{ github.run_number }}.mp4 --seed $SEED --duration 60

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: analog-horror-video
          path: out/*.mp4

